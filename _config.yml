# Build settings (GitHub Pages builds this natively)
theme: null  # no gem theme; layouts live in this repo
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page
      # Link previews (LinkedIn, Telegram, email): a small square portrait card
      image:
        path: /assets/img/profile.jpg
        width: 400
        height: 400
        alt: Sobhan Kasaei
      twitter:
        card: summary
  - scope:
      path: "google4c197dcacc471769.html"
    values:
      sitemap: false

exclude:
  - README.md
  - assets/fonts/README.md
  - Gemfile
  - Gemfile.lock
  - vendor
