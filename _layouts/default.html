<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
  <div class="scroll-sentinel" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include masthead.html %}
  <div class="layout">
    {% include sidebar.html %}
    <main id="main" class="content">
      {{ content }}
    </main>
  </div>
  <footer class="site-footer">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }} &middot; Last updated {{ site.time | date: "%B %Y" }}<span class="print-only"> &middot; {{ site.url | remove: "https://" }}</span></p>
  </footer>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/masthead.js' | relative_url }}"></script>
</body>
</html>
